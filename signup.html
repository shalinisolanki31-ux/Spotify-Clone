<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />    

</head>
<body>
    <div class="sign-up">
        <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_White.png" alt="spotify-logo">
        <h1>Sign up to <br>start listening</h1>
        <form action="#">
            <div class="field">
            <input type="email" id="mail" placeholder="name@domain.com" required>
            <i class="fa-solid fa-envelope"></i>
            </div>
        </form>
        <div class="external">
        <a href="#">Use phone number instead.</a>
        </div>
        <button >Next</button>
        <p>or</p>
        <div class="register">
         <div class="btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 533.5 544.3" width="21" height="21">
      <path fill="#4285F4" d="M533.5 278.4c0-17.4-1.5-34-4.3-50.2H272v95h147.4c-6.4 34.6-25.6 63.9-54.6 83.5v69h88.2c51.6-47.6 80.5-117.8 80.5-197.3z"/>

        </svg>
          <label type="submit">Sign up with Google</label>
       </div>

       <div class="btn">

      <path d="M15.195 4.513C15.873 3.69 16.351 2.567 16.351 1.433C16.351 1.278 16.341 1.123 16.318 1C15.206 1.044 13.872 1.734 13.083 2.668C12.449 3.379 11.871 4.513 11.871 5.647C11.871 5.825 11.905 5.991 11.916 6.047C11.982 6.058 12.094 6.08 12.216 6.08C13.206 6.08 14.45 5.413 15.195 4.513ZM15.973 6.313C14.317 6.313 12.961 7.325 12.093 7.325C11.171 7.325 9.97 6.38 8.525 6.38C5.779 6.38 3 8.648 3 12.918C3 15.586 4.023 18.398 5.301 20.211C6.391 21.744 7.347 23 8.725 23C10.081 23 10.682 22.1 12.371 22.1C14.083 22.1 14.472 22.978 15.973 22.978C17.463 22.978 18.453 21.61 19.397 20.265C20.442 18.72 20.887 17.219 20.897 17.142C20.809 17.119 17.963 15.952 17.963 12.695C17.963 9.871 20.198 8.604 20.331 8.504C18.852 6.381 16.596 6.314 15.973 6.314V6.313Z" fill="white"/>
       </svg>
       <label type="submit">Sign up with Apple</label>
      </div>
     </div>
        <div class="another">
            <span class="account">Already have an account?</span>
        <a href="login.html" class="login">Log in</a>
        </div>
        
    </div>

</html>
